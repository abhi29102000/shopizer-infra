name: Build Images

on:
  repository_dispatch:
    types: [ci-complete]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ── Backend ────────────────────────────────────────────────
      - name: Download backend JAR
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.INFRA_TOKEN }}
          repo: abhi29102000/shopizer
          workflow: ci.yml
          name: shopizer-jar
          path: backend

      - name: Build backend image
        run: |
          mkdir -p sm-shop-context/target
          cp backend/shopizer.jar sm-shop-context/target/shopizer.jar
          curl -sL https://raw.githubusercontent.com/abhi29102000/shopizer/F-createDOc/sm-shop/Dockerfile -o sm-shop-context/Dockerfile
          curl -sL https://raw.githubusercontent.com/abhi29102000/shopizer/F-createDOc/sm-shop/SALESMANAGER.h2.db -o sm-shop-context/SALESMANAGER.h2.db
          mkdir -p sm-shop-context/files
          docker build sm-shop-context/ \
            -t ghcr.io/abhi29102000/shopizer:${{ github.sha }} \
            -t ghcr.io/abhi29102000/shopizer:latest

      # ── Storefront ─────────────────────────────────────────────
      - name: Download storefront build
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.INFRA_TOKEN }}
          repo: abhi29102000/shopizer-shop-reactjs
          workflow: ci.yml
          name: shopizer-shop-build
          path: storefront/build

      - name: Download storefront config files
        run: |
          curl -sL https://raw.githubusercontent.com/abhi29102000/shopizer-shop-reactjs/F-createDOc/env.sh -o storefront/env.sh
          curl -sL https://raw.githubusercontent.com/abhi29102000/shopizer-shop-reactjs/F-createDOc/.env -o storefront/.env
          mkdir -p storefront/conf
          curl -sL https://raw.githubusercontent.com/abhi29102000/shopizer-shop-reactjs/F-createDOc/conf/conf.d/default.conf -o storefront/conf/conf.d/default.conf 2>/dev/null || true

      - name: Build storefront image
        run: |
          docker build storefront/ -f dockerfiles/Dockerfile.storefront \
            -t ghcr.io/abhi29102000/shopizer-shop:${{ github.sha }} \
            -t ghcr.io/abhi29102000/shopizer-shop:latest

      # ── Admin ──────────────────────────────────────────────────
      - name: Download admin dist
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.INFRA_TOKEN }}
          repo: abhi29102000/shopizer-admin
          workflow: ci.yml
          name: shopizer-admin-dist
          path: admin/dist

      - name: Download admin config files
        run: |
          curl -sL https://raw.githubusercontent.com/abhi29102000/shopizer-admin/F-createDOc/docker/nginx.conf -o admin/nginx.conf

      - name: Build admin image
        run: |
          docker build admin/ -f dockerfiles/Dockerfile.admin \
            -t ghcr.io/abhi29102000/shopizer-admin:${{ github.sha }} \
            -t ghcr.io/abhi29102000/shopizer-admin:latest

      # ── Push all ───────────────────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all images
        run: |
          docker push ghcr.io/abhi29102000/shopizer:${{ github.sha }}
          docker push ghcr.io/abhi29102000/shopizer:latest
          docker push ghcr.io/abhi29102000/shopizer-shop:${{ github.sha }}
          docker push ghcr.io/abhi29102000/shopizer-shop:latest
          docker push ghcr.io/abhi29102000/shopizer-admin:${{ github.sha }}
          docker push ghcr.io/abhi29102000/shopizer-admin:latest
