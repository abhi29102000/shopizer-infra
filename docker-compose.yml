services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: SALESMANAGER
      MYSQL_USER: shopizer
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: shopizer-backend:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      db.jdbcUrl: "jdbc:mysql://mysql:3306/SALESMANAGER?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
      db.user: shopizer
      db.password: password
    depends_on:
      mysql:
        condition: service_healthy

  storefront:
    image: shopizer-storefront:local
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin:
    image: shopizer-admin:local
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data:
